[package]
name = "grammers-mtsender"
version = "0.10.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
A sender implementation using the Mobile Transport Protocol.
"""
homepage = "https://github.com/xD-Mohamed/grammers"
documentation = "https://xd-mohamed.github.io/grammers/api/grammers_mtsender/"
repository = "https://github.com/xD-Mohamed/grammers"
keywords = ["api", "mtproto", "telegram", "tl"]
categories = ["api-bindings", "network-programming"]
edition = "2024"

[features]
proxy = ["tokio-socks", "hickory-resolver", "url", "dep:base64", "dep:httparse", "dep:percent-encoding", "dep:tokio-rustls", "dep:webpki-roots", "dep:getrandom", "dep:sha2", "dep:hmac"]

[dependencies]
bytes = "1.12.0"
grammers-crypto = { path = "../grammers-crypto", version = "0.10.0" }
grammers-mtproto = { path = "../grammers-mtproto", version = "0.10.0" }
grammers-session = { path = "../grammers-session", version = "0.10.0", default-features = false }
grammers-tl-types = { path = "../grammers-tl-types", version = "0.10.0", features = [ "tl-mtproto", "deserializable-functions" ] }
locate-locale = "0.2.0"
os_info = { version = "3.15.0", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "sync", "time", "net", "macros", "rt"] }
tracing.workspace = true

tokio-socks = { version = "0.5.3", optional = true }
hickory-resolver = { version = "0.26.1", optional = true }
url = { version = "2.5.8", optional = true }
base64 = { version = "0.22.1", optional = true }
httparse = { version = "1.10.1", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.11.0", optional = true }
hmac = { version = "0.13.0", optional = true }

[dev-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "test-util"] }
toml = "1.1.2"
socks5-server = "0.10.1"
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
