[package]
name = "grammers-session"
version = "0.10.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
Different session storages for Telegram data.
"""
homepage = "https://github.com/xD-Mohamed/grammers"
documentation = "https://xd-mohamed.github.io/grammers/api/grammers_session/"
repository = "https://github.com/xD-Mohamed/grammers"
keywords = ["telegram", "tl"]
categories = []
edition = "2024"

[features]
default = ["sqlite-storage"]
sqlite-storage = ["dep:libsql"]
serde = ["dep:serde", "dep:serde_with"]
session-import = ["dep:base64", "dep:serde", "dep:serde_json", "dep:sha1"]
session-import-files = ["session-import", "dep:libsql", "tokio/rt"]
session-string = ["dep:base64", "dep:sha2"]

[dependencies]
grammers-tl-types = { path = "../grammers-tl-types", version = "0.10.0" }

libsql = { version = "0.9.30", default-features = false, features = ["core"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["sync"] }
tracing.workspace = true

serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3", features = ["hex"], optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
toml = "1.1.2"
tokio = { version = "1.52.3", default-features = false, features = ["sync", "rt"] }

[[example]]
name = "session_string_demo"
required-features = ["session-string"]
