[package]
name = "grammers-client"
version = "0.10.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
A high level client to interact with Telegram's API.
"""
homepage = "https://github.com/xD-Mohamed/grammers"
documentation = "https://xd-mohamed.github.io/grammers/api/grammers_client/"
repository = "https://github.com/xD-Mohamed/grammers"
keywords = ["mtproto", "telegram", "tl"]
categories = ["api-bindings"]
edition = "2024"

[features]
dispatcher = []
qr-login = ["dep:base64"]
markdown = ["dep:pulldown-cmark"]
html = ["dep:html5ever"]
proxy = ["grammers-mtsender/proxy"]
parse_invite_link = ["dep:url"]
fs = ["tokio/fs"]
session-file = ["grammers-session/sqlite-storage"]
session-string = ["grammers-session/session-string"]
session-import = ["grammers-session/session-import"]
session-import-files = ["session-import", "grammers-session/session-import-files"]
default = ["fs"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
futures-util = { version = "0.3.32", default-features = false, features = [
    "alloc", "std"
] }
grammers-crypto = { path = "../grammers-crypto", version = "0.10.0" }
grammers-mtsender = { path = "../grammers-mtsender", version = "0.10.0" }
grammers-session = { path = "../grammers-session", version = "0.10.0", default-features = false }
grammers-tl-types = { path = "../grammers-tl-types", version = "0.10.0", features = [
    "tl-mtproto",
] }
html5ever = { version = "0.39.0", optional = true }
jiff = "0.2.35"
md5 = "0.8.0"
mime_guess = "2.0.5"
pin-project-lite = "0.2"
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
tokio = { version = "1.52.3", default-features = false, features = [
    "rt", "macros"
] }
tracing.workspace = true
url = { version = "2.5.8", optional = true }

[dev-dependencies]
base64 = "0.22.1"
rpassword = "7.5.4"
tokio = { version = "1.52.3", default-features = false, features = [
    "signal",
] }
tracing-subscriber.workspace = true
toml = "1.1.2"

[[example]]
name = "dispatcher"
required-features = ["dispatcher", "session-file"]

[[example]]
name = "qr_login"
required-features = ["qr-login", "session-file"]

[[example]]
name = "ping"

[[example]]
name = "echo"
required-features = ["session-file"]

[[example]]
name = "downloader"
required-features = ["session-file", "fs"]

[[example]]
name = "dialogs"
required-features = ["session-file"]

[[example]]
name = "inline-pagination"
required-features = ["session-file"]

[[example]]
name = "send_album"
required-features = ["session-file"]

[[example]]
name = "import_session"
required-features = ["session-string", "session-import-files", "fs"]

[[example]]
name = "managed_client"
required-features = ["session-string"]

[[example]]
name = "export_session"
required-features = ["session-file", "session-string"]

[[example]]
name = "send_options"
required-features = ["session-string", "fs"]
